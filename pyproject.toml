[project]
name = "kestrl"
version = "0.1.0"
description = "KestRL - Reinforcement Learning Library built on JAX/Flax"
authors = [{ name = "adidi" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # === PyTorch stack (benchrl) ===
    "torch>=2.7.0,<3.0.0",
    "gymnasium[mujoco]>=1.2.2,<2.0.0",
    "numpy>=2.2.5,<3.0.0",
    "stable-baselines3>=2.6.0,<3.0.0",
    "wandb>=0.19.11,<0.20.0",
    "tensorboard>=2.19.0,<3.0.0",
    "ale-py>=0.11.0,<0.12.0",
    "opencv-python>=4.11.0.86,<5.0.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "psutil>=7.0.0,<8.0.0",
    "requests>=2.32.3,<3.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "nvitop>=1.5.0,<2.0.0",
    "tyro>=0.9.20,<0.10.0",
    "icu-sepsis>=2.0.1,<3.0.0",
    "omegaconf>=2.3.0,<3.0.0",
    "hydra-core>=1.3.2,<2.0.0",
    "pysc2>=4.0.0,<5.0.0",
    "sc2reader>=1.8.0,<2.0.0",
    "pettingzoo>=1.25.0,<2.0.0",
    "dm-tree>=0.1.9",
    "pytest>=8.4.2,<9.0.0",
    "ffmpeg>=1.4,<2.0",
    "imageio-ffmpeg>=0.6.0,<0.7.0",
    "tensorflow>=2.20.0,<3.0.0",
    "moviepy>=2.2.1,<3.0.0",
    # === JAX stack (kestrl) ===
    "jax[cpu]",
    "flax",
    "optax",
    "distrax",
    "chex",
    "orbax-checkpoint",
    "tf-keras>=2.20.1",
    "tensorboardx>=2.6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchrl", "src/kestrl"]
