_target_: kestrl.algorithms.pbsac.PBSAC
name: pbsac

# Network architecture — _partial_=True in _build_networks() injects obs_dim/action_dim/rngs
actor_network:
  _target_: kestrl.networks.MultiHeadMLP
  hidden_dims: [256, 256]
  activation: relu

critic_network:
  _target_: kestrl.networks.MLP
  hidden_dims: [256, 256]
  activation: relu

# Core hyperparameters
total_timesteps: 1000000
buffer_size: 1000000
learning_starts: 5000
batch_size: 256
train_freq: 1
target_update_interval: 1
policy_frequency: 2
gamma: 0.99
tau: 0.005

# Learning rates
lr_actor: 3e-4
lr_critic: 1e-3
lr_alpha: 3e-4

# Entropy
autotune_alpha: true
alpha: 0.2 # used only when autotune_alpha=false

# PAC-Bayes specific parameters
pac_bayes_active: true
pb_num_envs: 10
pb_update_freq: 20000 # Update frequency of PAC-Bayes components
delta: 0.05 # failure probability in PAC-Bayes bound
r_max_estimate: 10.0 # Conservative estimate
mixing_time: 200 # Conservative estimate
pb_rollout_trajectories: 20
pb_rollout_steps: 1000
pb_policy_samples: 8 # Samples for estimation
pb_update_epochs: 100 # Optimization epochs
pb_reset_prior_freq: 10 # EMA-style prior reset frequency
pb_prior_decay: 0.99 # Decay factor for prior
pb_init_std: 0.01 # Initial std for posterior
pb_posterior_lr: 1e-3 # Learning rate for posterior optimization
pb_rank: 15 # Low-rank dimension for covariance

# Actor freezing for stability after PAC-Bayes updates
actor_freeze_steps: 20 # Steps to freeze actor after PB update
adaptation_samples: 256 # Samples during critic adaptation

# Posterior-guided exploration
explore_prob_init: 0.5 # Used for UCB exploration scheduling
explore_prob_final: 0.1 # Used for UCB exploration scheduling
explore_prob_decay_duration: 0.5 # Duration of explore_prob decay
explore_n_samples: 4 # Policies sampled for UCB check
