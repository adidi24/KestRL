_target_: kestrl.algorithms.sac.SAC
compiled_factory: kestrl.algorithms.sac.compiled.sac.make_compiled_sac
name: sac

# Network architecture
actor_network:
  _target_: kestrl.networks.MLP
  hidden_dims: [64]
  activation: relu

critic_network:
  _target_: kestrl.networks.MLP
  hidden_dims: [64]
  activation: relu

# Core hyperparameters
total_timesteps: 500000
buffer_size: 100000
learning_starts: 10000
batch_size: 128
train_freq: 10
target_update_interval: 500
policy_frequency: 1
gamma: 0.99
tau: 0.005

# Learning rates
lr_actor: 2.5e-4
lr_critic: 1e-3
lr_alpha: 1e-3

# Entropy
autotune_alpha: true
target_entropy_ratio: 0.10 # reduces over-exploration in SAC for small discrete envs like CartPole
alpha: 0.2 # used only when autotune_alpha=false
